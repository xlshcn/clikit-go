version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert

  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]

  exclusions:
    rules:
      # Tests print to buffers and drive spinners; unchecked writes are noise.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
